# Config of the model clinic (synthetic). This is the INITIAL SEED: services, hours and rules
# then live in the database (the admin edits them there, the agent reads them via list_services).
# ⚠️ marks an assumption to be confirmed or corrected.

[clinic]
name = "さくら歯科 (synthetic)"
timezone = "Asia/Tokyo"
chairs = 4
slot_minutes = 30

# Closed all day: Thursday, Sunday, holidays (jpholiday).
closed_weekdays = ["thu", "sun"]
closed_on_holidays = true

# Working shifts. The last slot ends at close.
# A multi-slot appointment cannot cross the break between shifts.
[[hours]]
weekdays = ["mon", "tue", "wed", "fri"]
open = "09:00"
close = "12:30"
[[hours]]
weekdays = ["mon", "tue", "wed", "fri"]
open = "14:00"
close = "18:30"
[[hours]]                 # ⚠️ two shifts on Saturday is an assumption
weekdays = ["sat"]
open = "09:00"
close = "12:30"
[[hours]]
weekdays = ["sat"]
open = "14:00"
close = "17:30"

# Default rules. Any of them can be overridden per service (see below).
[rules]
horizon_days = 60
min_lead_hours = 2
cancel_before_hours = 24
max_active_per_patient = 2
max_failed_attempts = 5      # failed identity checks in a row (per card or per client)
lockout_minutes = 15         # lockout after that

# Services. duration_slots: 1 = 30 minutes, 2 = 60 minutes.
# Optional per-service fields (override [rules]):
#   horizon_days, min_lead_hours, cancel_before_hours,
#   allowed_windows = [["09:00", "12:30"]]   # e.g. mornings only
#   is_active = false                          # hide the service from the agent
[services.shoshin]           # 初診
label_ja = "初診"
duration_slots = 2
new_patient_only = true

[services.chiryo]            # 治療 (with X-ray)
label_ja = "治療"
duration_slots = 2

[services.shishu]            # 歯周検査 (⚠️ wording from open question 2 of the SPEC)
label_ja = "歯周検査"
duration_slots = 1

[services.cleaning]          # クリーニング
label_ja = "クリーニング"
duration_slots = 1
recall_months = 3
horizon_days = 200

[services.kenshin]           # 定期検診
label_ja = "定期検診"
duration_slots = 1
recall_months = 6
horizon_days = 200

# Everything for reproducible synthetic data and evaluation.
[synthetic]
seed = 20261007
frozen_now = 2026-10-07T10:00:00+09:00   # "now" for the agent, the code and the scenarios (Wednesday)
schedule_weeks = 8                       # the schedule is filled this many weeks ahead
test_patients = 60                       # the agent talks to these (fixtures included)
background_patients = 450                # create the background load; never in dialogues
background_source = "phone"
far_recall_count = 40                    # rare cleaning/check-up appointments beyond 8 weeks (up to 200 days)

# Share of services among background appointments.
[synthetic.service_mix]
shoshin = 0.10
chiryo = 0.40
shishu = 0.15
cleaning = 0.20
kenshin = 0.15

# Load: the coming weeks are dense, later windows are free (as in real life).
# Day occupancy = min(cap, by_weeks_ahead[week] × weekday_multiplier[day]).
# Expected: the first 3 weeks ~55–80%, the whole window ~35–40%. Fixtures (FIXTURES.md) are loaded first
# and override this profile.
[synthetic.load]
by_weeks_ahead = [0.95, 0.85, 0.65, 0.45, 0.30, 0.20, 0.12, 0.08]
cap = 0.98
[synthetic.load.weekday_multiplier]
mon = 0.6
tue = 1.0
wed = 0.9
fri = 1.1
sat = 0.6
