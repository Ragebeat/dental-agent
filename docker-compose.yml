services:
  db:
    image: postgres:17
    container_name: dental-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dental}
      POSTGRES_USER: ${POSTGRES_USER:-dental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Japanese text — UTF-8 only
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5441 on the host: other Postgres instances already use 5432/5433/...
      - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental} -d ${POSTGRES_DB:-dental}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
