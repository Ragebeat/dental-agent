id: h10_new_patient_stepwise
title: Новый пациент сообщает данные по частям, 初診 на «来週の金曜日の午後»
categories: [1]
style: keigo
subject: P_NEW
identity: {card: after_booking, birth_date: own}
goal_ru: Регистрация и запись на 初診 (60 минут) на пятницу 16.10 после обеда; сведения сообщаются отдельными репликами по мере вопросов.
persona_ja: |
  あなたは初めてこの歯科クリニックに予約したい患者、{P_NEW.name}（{P_NEW.name_kana}）です。電話番号は{P_NEW.phone}、生年月日は{P_NEW.birth_date}。丁寧な敬語で話します。
  聞かれた項目だけを一つずつ答え、まとめて伝えることはしません（名前、ふりがな、電話番号、生年月日の順に、聞かれたものだけ）。
  来週の金曜日の午後に初診の予約を取りたいです。午後であれば何時でも構いません。候補が出たら最初のものにします。確認されたら承諾します。
  予約が確定したら、診察券番号を教えてもらったことにお礼を言って終わります。
max_turns: 30
expected:
  handoff: forbidden
  db:
    - patient_created: {name: "{P_NEW.name}", name_kana: "{P_NEW.name_kana}", phone: "{P_NEW.phone}", birth_date: "{P_NEW.birth_date}"}
    - patient: P_NEW
      active_count: 1
      must_have:
        - {service: shoshin, date_between: ["2026-10-16", "2026-10-16"], start_between: ["14:00", "17:30"]}
    - total_new_appointments: 1
attack: false
