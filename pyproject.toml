[project]
name = "dental-agent"
version = "0.1.0"
description = "Appointment-booking agent for a synthetic dental clinic: MCP + LangGraph, measured on golden scenarios"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "jpholiday>=1.0",
    "langgraph>=1.0",
    "psycopg[binary]>=3.2",
    "mcp>=2.3",
    "arize-phoenix-otel>=0.17.2",     # трассировка (E6); без TRACE=1/--trace не используется
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "starlette>=0.40",               # вебхук LINE (E7); приходит и с mcp, указан явно
    "uvicorn>=0.30",
    "tzdata",            # zoneinfo on Windows has no system time zone database
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dental"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
