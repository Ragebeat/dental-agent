# LLM profiles. Any profile is an OpenAI-compatible chat endpoint (both Ollama and OpenRouter provide one).
# The key is not stored here: api_key_env names the environment variable (or a line in .env).
# Roles pick a profile for the agent and for the patient simulator (preferably different models: see docs/DECISIONS.md).

[roles]
agent = "local"
simulator = "or_sim_ds"

[profiles.local]                       # Ollama on this machine
# model: the EXACT tag from `ollama list` (NAME column). Context: Ollama's /v1 endpoint does not accept num_ctx in the request,
# set it on the Ollama side (OLLAMA_CONTEXT_LENGTH=16384 or a Modelfile with `PARAMETER num_ctx 16384`),
# otherwise a long prompt with tools is silently truncated.
base_url = "http://127.0.0.1:11434/v1"
model = "gemma4:e4b"
api_key_env = ""
temperature = 0.0
timeout_s = 240
max_tokens = 1024

# Example cloud profile via OpenRouter: uncomment, put OPENROUTER_API_KEY into .env,
# pick a model at openrouter.ai/models (it must support tools), and run:
#   uv run python -m dental.eval.run --agent-profile or_agent --sim-profile local
# Cloud agent for the "local model vs cloud model" comparison (E8, synthetic data only).
# Check the slug at openrouter.ai/models (it must support tools).
[profiles.or_agent]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-2.5-flash"
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.0
timeout_s = 120
max_tokens = 1024
extra_body = { usage = { include = true } }   # OpenRouter returns the request cost in usage.cost

# Patient simulator: a strong model, so the dialogue stays in role (gemma 4B mixed up roles in 5 scenarios in the first run).
# Check the slug at openrouter.ai/models. The OPENROUTER_API_KEY lives in .env.
[profiles.or_sim]
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-haiku-4.5"
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.7
timeout_s = 120
max_tokens = 300
extra_body = { usage = { include = true } }

# Cheap patient simulator (DeepSeek Flash, slug pinned, no ~…-latest alias, for reproducibility).
# Unknown whether the model reasons by default: check cost and latency on 1–2 scenarios.
[profiles.or_sim_ds]
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.7
timeout_s = 120
max_tokens = 300
extra_body = { usage = { include = true } }
